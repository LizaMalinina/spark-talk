services:
  spark:
    build: .
    container_name: pyspark-demo
    ports:
      - "4040:4040"  # Spark UI
      - "8888:8888"  # Jupyter
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./scripts:/app/scripts
    environment:
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=4g
    command: >
      bash -c "
        echo 'Starting Jupyter Lab...' &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
      "
    stdin_open: true
    tty: true

  spark-shell:
    build: .
    container_name: pyspark-shell
    ports:
      - "4041:4040"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    environment:
      - SPARK_DRIVER_MEMORY=4g
    command: python3 scripts/demo_lazy_evaluation.py
    profiles:
      - demo
